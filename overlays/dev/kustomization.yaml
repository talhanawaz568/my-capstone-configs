resources:
  - ../../base
namePrefix: dev-
replicas:
  - name: capstone-app
    count: 1
images:
  - name: talha884/my-capstone-app
    newTag: ec3c0f1
patches:
  - target:
      kind: Deployment
      name: capstone-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: dev
